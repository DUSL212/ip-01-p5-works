<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORBIS · 可交互曼陀罗</title>
<style>
  html,body{height:100%;margin:0;background:#05070d;overflow:hidden;}
  #art{
    display:block;width:100vw;height:100vh;cursor:none;touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }
  .hint{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
    color:rgba(233,192,122,.62);pointer-events:none;white-space:nowrap;
    font:11px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    letter-spacing:.24em;text-transform:uppercase;
    text-shadow:0 0 18px rgba(233,192,122,.35);
    transition:opacity .8s;text-align:center;
  }
  .hint.dim{opacity:.22;}
  .hint b{font-weight:400;color:rgba(255,238,194,.82);}
  .save{
    position:fixed;right:20px;top:18px;padding:8px 15px;border-radius:999px;
    border:1px solid rgba(233,192,122,.28);background:rgba(233,192,122,.05);
    color:rgba(246,224,170,.72);cursor:pointer;opacity:.35;transition:.3s;
    font:11.5px/1 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.12em;
    backdrop-filter:blur(8px);
  }
  .save:hover{opacity:1;background:rgba(233,192,122,.14);border-color:rgba(233,192,122,.55);}

  .themes{
    position:fixed;left:24px;bottom:24px;display:flex;gap:10px;align-items:center;
    padding:8px 13px;border-radius:999px;
    background:rgba(10,14,22,.5);border:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(10px);
  }
  .th{
    width:16px;height:16px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.22);
    transition:transform .25s,box-shadow .25s,opacity .25s;opacity:.5;
  }
  .th:hover{transform:scale(1.25);opacity:1;}
  .th.active{opacity:1;transform:scale(1.18);box-shadow:0 0 0 2px rgba(255,255,255,.16),0 0 14px currentColor;}
  .th-label{
    font:10.5px/1 -apple-system,"PingFang SC",sans-serif;letter-spacing:.16em;
    color:rgba(255,255,255,.42);margin-left:2px;text-transform:uppercase;
    min-width:34px;
  }
</style>
</head>
<body>
<canvas id="art"></canvas>
<button class="save" id="save">保存 PNG</button>

<div class="themes" id="themes">
  <button class="th active" data-i="0" style="background:linear-gradient(135deg,#ffeec2,#c99a4e);color:#e9c07a" title="鎏金"></button>
  <button class="th" data-i="1" style="background:linear-gradient(135deg,#d8fff4,#2f9d88);color:#5fe3c6" title="青玉"></button>
  <button class="th" data-i="2" style="background:linear-gradient(135deg,#ffe3ec,#b1446a);color:#ff8fb0" title="绯樱"></button>
  <button class="th" data-i="3" style="background:linear-gradient(135deg,#e8f3ff,#3d63a8);color:#8fb8ff" title="霜蓝"></button>
  <span class="th-label" id="themeName">gold</span>
</div>

<div class="hint" id="hint">
  <b>拖动</b> 旋转 · <b>滚轮</b> 缩放 · <b>点击</b> 绽放 · <b>C</b> 换色
</div>

<script>
(function(){
  "use strict";

  const cvs = document.getElementById('art');
  const ctx = cvs.getContext('2d');
  const TAU = Math.PI * 2;

  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 0, Rbase = 0;
  let zoom = 1, zoomTarget = 1;
  let noisePat = null;
  let last = performance.now();
  let idleAt = 0;
  let hoverAng = -Math.PI / 2, hoverAmt = 0;
  let capturing = false;
  let bump = 0;

  /* 旋转 */
  let rot = 0, vel = 0;
  let dragging = false, dragMoved = 0, dragStartX = 0, dragStartY = 0, lastAng = 0;

  const P = { x: 0, y: 0, sx: 0, sy: 0, inside: false };
  const ripples = [];
  const sparks = [];

  /* ================= 配色 ================= */
  const THEMES = [
    { id: 'gold', bg: ['#0e1626', '#04060b'], c1: '#fff2cf', c2: '#e9c07a', c3: '#a3702f',
      n: ['#1e4e76', '#683484', '#966028'] },
    { id: 'jade', bg: ['#06181b', '#02080a'], c1: '#e6fff8', c2: '#5fe3c6', c3: '#1d6f63',
      n: ['#0d5a63', '#1b4c7a', '#25705c'] },
    { id: 'rose', bg: ['#190a13', '#07040a'], c1: '#ffe9f1', c2: '#ff8fb0', c3: '#8a2c4c',
      n: ['#761f43', '#4b2060', '#8c3a2a'] },
    { id: 'ice',  bg: ['#0a1220', '#03060c'], c1: '#eef6ff', c2: '#8fb8ff', c3: '#2f4f8a',
      n: ['#1a3766', '#123a5c', '#2b2f7a'] }
  ];

  let themeIdx = 0;
  const PAL = {};
  const TGT = {};

  function hex2rgb(h){
    h = h.replace('#', '');
    if (h.length === 3) h = h.split('').map(function(c){ return c + c; }).join('');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  function rgb(a){ return 'rgb(' + Math.round(a[0]) + ',' + Math.round(a[1]) + ',' + Math.round(a[2]) + ')'; }
  function rgba(a, al){ return 'rgba(' + Math.round(a[0]) + ',' + Math.round(a[1]) + ',' + Math.round(a[2]) + ',' + al + ')'; }
  function mixRGB(a, b, t){
    return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, a[2] + (b[2]-a[2])*t];
  }

  function themeToTarget(th){
    return {
      bg0: hex2rgb(th.bg[0]), bg1: hex2rgb(th.bg[1]),
      c1: hex2rgb(th.c1), c2: hex2rgb(th.c2), c3: hex2rgb(th.c3),
      n0: hex2rgb(th.n[0]), n1: hex2rgb(th.n[1]), n2: hex2rgb(th.n[2])
    };
  }

  function applyTheme(i, instant){
    themeIdx = i;
    const tt = themeToTarget(THEMES[i]);
    for (const k in tt){
      TGT[k] = tt[k];
      if (instant) PAL[k] = tt[k].slice();
    }
    const el = document.getElementById('themeName');
    if (el) el.textContent = THEMES[i].id;
    Array.prototype.forEach.call(document.querySelectorAll('.th'), function(b, idx){
      b.classList.toggle('active', idx === i);
    });
    const h = document.getElementById('hint');
    if (h){
      h.style.color = 'rgba(' + tt.c2.join(',') + ',.62)';
      h.style.textShadow = '0 0 18px rgba(' + tt.c2.join(',') + ',.35)';
    }
  }

  function lerpPal(){
    for (const k in TGT){
      const a = PAL[k], b = TGT[k];
      if (!a) { PAL[k] = b.slice(); continue; }
      a[0] += (b[0]-a[0]) * 0.09;
      a[1] += (b[1]-a[1]) * 0.09;
      a[2] += (b[2]-a[2]) * 0.09;
    }
  }

  /* ================= 尺寸 ================= */
  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width  = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    cvs.style.width  = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H / 2;
    Rbase = Math.min(W, H) * 0.355;
    R = Rbase * zoom;
    if (!P.inside){ P.x = cx; P.y = cy * 0.94; }
    makeNoise();
  }

  function makeNoise(){
    const n = document.createElement('canvas');
    n.width = n.height = 110;
    const g = n.getContext('2d');
    const img = g.createImageData(110, 110);
    for (let i = 0; i < img.data.length; i += 4){
      const v = 110 + Math.random() * 145;
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = 16 + Math.random() * 26;
    }
    g.putImageData(img, 0, 0);
    noisePat = ctx.createPattern(n, 'repeat');
  }

  /* ================= 形状 ================= */
  function petalPath(c, rIn, rOut, halfW){
    c.beginPath();
    c.moveTo(0, -rIn);
    c.bezierCurveTo( halfW, -(rIn + (rOut - rIn) * 0.42), halfW * 0.62, -rOut * 0.94, 0, -rOut);
    c.bezierCurveTo(-halfW * 0.62, -rOut * 0.94, -halfW, -(rIn + (rOut - rIn) * 0.42), 0, -rIn);
    c.closePath();
  }

  function starPath(c, rOut, rIn, points, r0){
    c.beginPath();
    for (let i = 0; i < points * 2; i++){
      const r = (i % 2) ? rIn : rOut;
      const a = r0 + i * Math.PI / points;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i) c.lineTo(x, y); else c.moveTo(x, y);
    }
    c.closePath();
  }

  function angDist(a, b){
    let d = Math.abs(a - b) % TAU;
    return d > Math.PI ? TAU - d : d;
  }

  /* 起伏的圆环：两个正弦谐波叠加，像会呼吸的墨线 */
  function wavyRingPath(rr, amp, freq, phase){
    const N = 150;
    ctx.beginPath();
    for (let i = 0; i <= N; i++){
      const a = i / N * TAU;
      const w = Math.sin(a * freq + phase) + 0.45 * Math.sin(a * freq * 2 - phase * 1.6);
      const r = rr + w * amp;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath();
  }

  /* 行波粗细：一圈切成多段，每段粗细随角度推移，像光在环上跑 */
  function travelRing(rr, segs, wBase, wAmp, phase, alpha){
    for (let i = 0; i < segs; i++){
      const a0 = i / segs * TAU;
      const a1 = (i + 1) / segs * TAU - 0.005;
      const k = 0.5 + 0.5 * Math.sin(a0 * 2 - phase);
      ctx.lineWidth = wBase * (0.3 + wAmp * k);
      ctx.strokeStyle = rgba(PAL.c1, alpha * (0.22 + 0.78 * k));
      ctx.beginPath();
      ctx.arc(0, 0, rr, a0, a1);
      ctx.stroke();
    }
  }

  /* 流动虚线环 */
  function dashRing(rr, dash, gap, offset, w, alpha){
    ctx.save();
    ctx.setLineDash([dash, gap]);
    ctx.lineDashOffset = offset;
    ctx.lineWidth = w;
    ctx.strokeStyle = rgba(PAL.c2, alpha);
    ctx.beginPath();
    ctx.arc(0, 0, rr, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  /* ================= 背景 ================= */
  function drawBG(t){
    const g = ctx.createRadialGradient(cx, cy - R * 0.15, R * 0.05, cx, cy, Math.max(W, H) * 0.78);
    g.addColorStop(0, rgb(PAL.bg0));
    g.addColorStop(0.42, rgb(mixRGB(PAL.bg0, PAL.bg1, 0.55)));
    g.addColorStop(1, rgb(PAL.bg1));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    blob(cx - W * 0.23 + Math.sin(t * 0.13) * W * 0.028, cy - H * 0.2, R * 1.7, rgba(PAL.n0, 0.22));
    blob(cx + W * 0.25, cy + H * 0.22 + Math.cos(t * 0.11) * H * 0.02, R * 1.35, rgba(PAL.n1, 0.17));
    blob(cx + W * 0.02, cy - H * 0.34, R * 1.1, rgba(PAL.n2, 0.10));

    /* 指针柔光：跟着鼠标的一团光，让画面一直"有反应" */
    if (P.inside){
      const pg = ctx.createRadialGradient(P.x, P.y, 0, P.x, P.y, R * 0.55);
      pg.addColorStop(0, rgba(PAL.c1, 0.085));
      pg.addColorStop(0.45, rgba(PAL.c2, 0.035));
      pg.addColorStop(1, rgba(PAL.c2, 0));
      ctx.fillStyle = pg;
      ctx.fillRect(P.x - R * 0.55, P.y - R * 0.55, R * 1.1, R * 1.1);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function blob(x, y, r, color){
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  /* ================= 曼陀罗 ================= */
  function mandala(t){
    const hov = hoverAmt;

    if (bump > 0.001) ctx.scale(1 + bump * 0.022, 1 + bump * 0.022);

    /* 背后光晕 */
    const glow = ctx.createRadialGradient(0, 0, R * 0.04, 0, 0, R * 1.3);
    glow.addColorStop(0, rgba(PAL.c2, 0.16 + 0.05 * Math.sin(t * 1.3) + bump * 0.18));
    glow.addColorStop(0.45, rgba(PAL.c2, 0.055));
    glow.addColorStop(1, rgba(PAL.c2, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, R * 1.3, 0, TAU);
    ctx.fill();

    /* --- 光点环（大小随行波起伏） --- */
    ctx.save();
    ctx.translate(-P.sx * 30, -P.sy * 30);
    ctx.rotate(t * 0.05 + rot);
    for (let i = 0; i < 96; i++){
      const a = i / 96 * TAU;
      const r = R * 1.045 + Math.sin(t * 1.6 + i * 0.35) * R * 0.007;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      const near = Math.exp(-Math.pow(angDist(hoverAng, a) / 0.35, 2)) * hov;
      const big = (i % 8 === 0);
      const sz = (big ? 0.0072 : 0.0034) * (1 + 0.85 * near);
      ctx.beginPath();
      ctx.arc(x, y, R * sz, 0, TAU);
      ctx.fillStyle = big ? rgba(PAL.c1, 0.9) : rgba(PAL.c2, 0.34 + 0.5 * near);
      ctx.fill();
    }
    ctx.restore();

    /* --- 起伏环 --- */
    ctx.save();
    ctx.rotate(rot);
    wavyRingPath(R * 0.985, R * 0.006, 9, t * 0.9);
    ctx.strokeStyle = rgba(PAL.c2, 0.34);
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();

    /* --- 流动虚线环（两层反向） --- */
    ctx.save();
    ctx.rotate(rot);
    dashRing(R * 0.968, R * 0.028, R * 0.030, -t * R * 0.10, R * 0.0045, 0.42);
    dashRing(R * 0.962, R * 0.008, R * 0.020, t * R * 0.16, R * 0.003, 0.26);
    ctx.restore();

    /* --- 12 道光芒（长度与宽度都在呼吸） --- */
    ctx.save();
    ctx.translate(-P.sx * 22, -P.sy * 22);
    ctx.rotate(t * 0.028 + rot);
    for (let i = 0; i < 12; i++){
      const a0 = i / 12 * TAU;
      const near = Math.exp(-Math.pow(angDist(hoverAng, a0) / 0.30, 2)) * hov;
      const puls = 0.5 + 0.5 * Math.sin(t * 2.2 + i * 0.9);
      const wid = R * 0.018 * (0.75 + 0.5 * puls) * (1 + 0.6 * near);
      const len = R * 1.055 * (1 + 0.02 * puls + 0.03 * near);

      ctx.save();
      ctx.rotate(a0);
      const g = ctx.createLinearGradient(0, -R * 0.55, 0, -len);
      g.addColorStop(0, rgba(PAL.c2, 0.04));
      g.addColorStop(0.5, rgba(PAL.c2, 0.45 + 0.35 * near));
      g.addColorStop(1, rgba(PAL.c1, 0.85 + 0.15 * near));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.55);
      ctx.quadraticCurveTo(wid, -R * 0.80, 0, -len);
      ctx.quadraticCurveTo(-wid, -R * 0.80, 0, -R * 0.55);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, -len - R * 0.006, R * 0.0105 * (1 + 0.5 * near), 0, TAU);
      ctx.fillStyle = rgba(PAL.c1, 0.95);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    /* --- 环带 --- */
    ctx.save();
    ctx.rotate(rot);
    const band = ctx.createRadialGradient(0, 0, R * 0.893, 0, 0, R * 0.942);
    band.addColorStop(0, rgba(PAL.c2, 0.05));
    band.addColorStop(0.5, rgba(PAL.c2, 0.30));
    band.addColorStop(1, rgba(PAL.c3, 0.10));
    ctx.strokeStyle = band;
    ctx.lineWidth = R * 0.049;
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.9175, 0, TAU);
    ctx.stroke();

    ctx.strokeStyle = rgba(PAL.c1, 0.5);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, R * 0.893, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, R * 0.942, 0, TAU); ctx.stroke();
    ctx.restore();

    /* --- 新月花丝 --- */
    ctx.save();
    ctx.translate(-P.sx * 18, -P.sy * 18);
    ctx.rotate(-t * 0.044 + rot);
    ctx.lineCap = 'round';
    for (let i = 0; i < 24; i++){
      const a0 = i / 24 * TAU;
      const near = Math.exp(-Math.pow(angDist(hoverAng, a0) / 0.28, 2)) * hov;
      ctx.save();
      ctx.rotate(a0);
      ctx.strokeStyle = (i % 2)
        ? rgba(PAL.c1, 0.42 + 0.5 * near)
        : rgba(PAL.c2, 0.55 + 0.4 * near);
      ctx.lineWidth = R * 0.0058 * (1 + 0.7 * near);
      ctx.beginPath();
      ctx.arc(0, -R * 0.83, R * 0.048, -0.62, 0.62);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    /* --- 行波粗细环 --- */
    ctx.save();
    ctx.rotate(rot);
    travelRing(R * 0.79, 44, R * 0.0055, 1.5, t * 1.5, 0.55);
    ctx.restore();

    /* --- 细刻度环（靠近指针的刻度变长变亮） --- */
    ctx.save();
    ctx.rotate(t * 0.02 + rot);
    for (let i = 0; i < 96; i++){
      const a = i / 96 * TAU;
      const near = Math.exp(-Math.pow(angDist(hoverAng, a) / 0.30, 2)) * hov;
      const base = (i % 8 === 0) ? R * 0.026 : R * 0.012;
      const len = base * (1 + 1.5 * near);
      ctx.strokeStyle = rgba(PAL.c2, 0.30 + 0.6 * near);
      ctx.lineWidth = 0.8 + 0.9 * near;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * R * 0.752, Math.sin(a) * R * 0.752);
      ctx.lineTo(Math.cos(a) * (R * 0.752 + len), Math.sin(a) * (R * 0.752 + len));
      ctx.stroke();
    }
    ctx.restore();

    /* --- 内侧流动虚线 --- */
    ctx.save();
    ctx.rotate(-t * 0.05 + rot);
    dashRing(R * 0.722, R * 0.012, R * 0.026, t * R * 0.06, R * 0.0035, 0.3);
    ctx.restore();

    /* --- 主莲瓣 16 --- */
    ctx.save();
    ctx.translate(-P.sx * 12, -P.sy * 12);
    const rotP = t * 0.058 + rot;
    const NP = 16, stepP = TAU / NP;
    for (let i = 0; i < NP; i++){
      const a0 = -Math.PI / 2 + i * stepP + rotP;
      const b = Math.exp(-Math.pow(angDist(hoverAng, a0) / 0.30, 2)) * hov;

      ctx.save();
      ctx.rotate(a0);
      const rIn = R * 0.305, rOut = R * 0.665;
      petalPath(ctx, rIn - R * 0.010 * b, rOut + R * 0.028 * b, R * 0.098 * (1 + 0.10 * b));

      const g = ctx.createLinearGradient(0, -rOut, 0, -rIn);
      g.addColorStop(0,   rgba(PAL.c1, 0.42 + 0.45 * b));
      g.addColorStop(0.42, rgba(PAL.c2, 0.30 + 0.38 * b));
      g.addColorStop(1,   rgba(PAL.c3, 0.12 + 0.22 * b));
      ctx.fillStyle = g;
      if (b > 0.03){
        ctx.shadowColor = rgba(PAL.c1, 0.65 * b);
        ctx.shadowBlur = 34 * b;
      }
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = rgba(PAL.c1, 0.55 + 0.40 * b);
      ctx.lineWidth = 1 + 0.9 * b;
      ctx.stroke();

      /* 花瓣脉络：一条中脉 + 两条侧脉 */
      ctx.strokeStyle = rgba(PAL.c1, 0.14 + 0.22 * b);
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(0, -rIn - R * 0.02);
      ctx.lineTo(0, -rOut + R * 0.03);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-R * 0.045, -rIn - R * 0.09);
      ctx.quadraticCurveTo(-R * 0.03, -rOut * 0.86, 0, -rOut + R * 0.06);
      ctx.moveTo(R * 0.045, -rIn - R * 0.09);
      ctx.quadraticCurveTo(R * 0.03, -rOut * 0.86, 0, -rOut + R * 0.06);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    /* --- 内层 8 瓣 --- */
    ctx.save();
    ctx.translate(-P.sx * 8, -P.sy * 8);
    ctx.rotate(-t * 0.085 + rot);
    for (let i = 0; i < 8; i++){
      ctx.save();
      ctx.rotate(i / 8 * TAU);
      const rIn = R * 0.135, rOut = R * 0.305;
      petalPath(ctx, rIn, rOut, R * 0.062);
      const g = ctx.createLinearGradient(0, -rOut, 0, -rIn);
      g.addColorStop(0,  rgba(PAL.c1, 0.62));
      g.addColorStop(0.6, rgba(PAL.c2, 0.26));
      g.addColorStop(1,  rgba(PAL.c3, 0.10));
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = rgba(PAL.c1, 0.55);
      ctx.lineWidth = 0.9;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    /* --- 八角星 --- */
    ctx.save();
    ctx.rotate(t * 0.02 + rot);
    const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.30);
    sg.addColorStop(0,   rgba(PAL.c1, 0.75));
    sg.addColorStop(0.55, rgba(PAL.c2, 0.30));
    sg.addColorStop(1,   rgba(PAL.c2, 0.05));
    starPath(ctx, R * 0.295, R * 0.108, 8, -Math.PI / 2);
    ctx.fillStyle = sg;
    ctx.fill();
    ctx.strokeStyle = rgba(PAL.c1, 0.62);
    ctx.lineWidth = 1;
    ctx.stroke();

    for (let i = 0; i < 8; i++){
      const a = -Math.PI / 2 + i * TAU / 8;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * R * 0.295, Math.sin(a) * R * 0.295, R * 0.008, 0, TAU);
      ctx.fillStyle = rgba(PAL.c1, 0.9);
      ctx.fill();
    }
    ctx.restore();

    /* --- 中心宝珠 --- */
    const pulse = 0.5 + 0.5 * Math.sin(t * 1.7);
    const cr = R * 0.072 * (1 + 0.07 * pulse);
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, cr * 3.6);
    cg.addColorStop(0,   'rgba(255,255,255,.98)');
    cg.addColorStop(0.10, rgba(PAL.c1, 0.92));
    cg.addColorStop(0.26, rgba(PAL.c2, 0.48));
    cg.addColorStop(0.55, rgba(PAL.c2, 0.12));
    cg.addColorStop(1,   rgba(PAL.c2, 0));
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(0, 0, cr * 3.6, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.rotate(-t * 0.16 + rot);
    for (let i = 0; i < 4; i++){
      ctx.save();
      ctx.rotate(i / 4 * TAU);
      petalPath(ctx, cr * 0.35, cr * 1.55, cr * 0.5);
      ctx.fillStyle = 'rgba(255,250,232,' + (0.55 + 0.25 * pulse) + ')';
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    /* --- 八向星芒 --- */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.rotate(t * 0.06 + rot);
    for (let i = 0; i < 4; i++){
      ctx.save();
      ctx.rotate(i * Math.PI / 4);
      const fl = ctx.createLinearGradient(0, -R * 0.37, 0, R * 0.37);
      fl.addColorStop(0, rgba(PAL.c1, 0));
      fl.addColorStop(0.5, rgba(PAL.c1, 0.45 + 0.3 * pulse));
      fl.addColorStop(1, rgba(PAL.c1, 0));
      ctx.fillStyle = fl;
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.37);
      ctx.lineTo(R * 0.016, 0);
      ctx.lineTo(0, R * 0.37);
      ctx.lineTo(-R * 0.016, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    /* --- 旋转流光 --- */
    if (typeof ctx.createConicGradient === 'function'){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const conic = ctx.createConicGradient(t * 0.22 + rot, 0, 0);
      for (let i = 0; i <= 12; i++){
        conic.addColorStop(i / 12, (i % 2) ? rgba(PAL.c1, 0) : rgba(PAL.c1, 0.055));
      }
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.93, 0, TAU);
      ctx.fillStyle = conic;
      ctx.fill();
      ctx.restore();
    }

    /* --- 指针角度的高光弧（长度呼吸） --- */
    if (hov > 0.02){
      const sweep = 0.075 + 0.02 * Math.sin(t * 3);
      ctx.save();
      ctx.rotate(hoverAng);
      ctx.strokeStyle = rgba(PAL.c1, 0.6 * hov);
      ctx.lineWidth = R * 0.008;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.945, -sweep, sweep);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* ================= 涟漪 & 火花 ================= */
  function updateFx(now, dt){
    for (let i = ripples.length - 1; i >= 0; i--){
      if (now - ripples[i].t0 > ripples[i].dur) ripples.splice(i, 1);
    }
    for (let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      const life = (now - s.t0) / s.dur;
      if (life >= 1){ sparks.splice(i, 1); continue; }
      s.px = s.x; s.py = s.y;
      s.x += s.vx * dt / 1000;
      s.y += s.vy * dt / 1000;
      s.vx *= 0.965;
      s.vy *= 0.965;
      s.vy += 12 * dt / 1000;
    }
  }

  function drawFx(now){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    for (const r of ripples){
      const p = (now - r.t0) / r.dur;
      const rad = R * 0.06 + p * R * 0.72;
      const a = Math.pow(1 - p, 2);
      ctx.strokeStyle = rgba(PAL.c1, 0.55 * a);
      ctx.lineWidth = 2.4 * (1 - p) + 0.4;
      ctx.beginPath();
      ctx.arc(r.x, r.y, rad, 0, TAU);
      ctx.stroke();

      ctx.strokeStyle = rgba(PAL.c2, 0.25 * a);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(r.x, r.y, rad * 0.72, 0, TAU);
      ctx.stroke();
    }

    for (const s of sparks){
      const life = (now - s.t0) / s.dur;
      const a = Math.pow(1 - life, 1.6);
      ctx.strokeStyle = rgba(PAL.c1, 0.85 * a);
      ctx.lineWidth = s.r * (1 - life * 0.5);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s.px, s.py);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ================= 光标 ================= */
  function drawCursor(t){
    if (!P.inside) return;
    const r = 13 + Math.sin(t * 3) * 1.6;
    ctx.save();
    ctx.strokeStyle = rgba(PAL.c1, dragging ? 0.9 : 0.55);
    ctx.lineWidth = dragging ? 1.6 : 1;
    ctx.beginPath();
    ctx.arc(P.x, P.y, dragging ? r + 4 : r, 0, TAU);
    ctx.stroke();

    ctx.strokeStyle = rgba(PAL.c1, 0.22);
    ctx.beginPath();
    ctx.arc(P.x, P.y, r * 1.9, 0, TAU);
    ctx.stroke();

    ctx.fillStyle = rgba(PAL.c1, 0.9);
    ctx.beginPath();
    ctx.arc(P.x, P.y, 1.8, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  /* ================= 后处理 ================= */
  function post(){
    if (noisePat){
      ctx.save();
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = noisePat;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    const v = ctx.createRadialGradient(cx, cy, R * 0.35, cx, cy, Math.max(W, H) * 0.72);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(0.72, 'rgba(0,0,0,.28)');
    v.addColorStop(1, 'rgba(0,0,0,.66)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  /* ================= 主循环 ================= */
  function frame(now){
    const dt = Math.min(46, now - last);
    last = now;
    const t = now / 1000;

    lerpPal();

    zoom += (zoomTarget - zoom) * 0.12;
    R = Rbase * zoom;

    if (bump > 0) bump = Math.max(0, bump - dt / 420);

    if (!dragging){
      rot += vel;
      vel *= 0.95;
      if (Math.abs(vel) < 0.00003) vel = 0;
    }

    const tx = (P.x - cx) / Math.max(W, 1);
    const ty = (P.y - cy) / Math.max(H, 1);
    P.sx += (tx - P.sx) * 0.055;
    P.sy += (ty - P.sy) * 0.055;

    const dx = P.x - cx, dy = P.y - cy;
    const dist = Math.hypot(dx, dy);
    let target = (P.inside && !dragging && dist < R * 1.12) ? 1 : 0;

    if (now - idleAt > 2600 && !dragging){
      hoverAng = -Math.PI / 2 + t * 0.52;
      target = 0.72;
    } else if (P.inside){
      hoverAng = Math.atan2(dy, dx);
    }
    hoverAmt += (target - hoverAmt) * 0.075;

    updateFx(now, dt);

    drawBG(t);
    ctx.save();
    ctx.translate(cx, cy);
    mandala(t);
    ctx.restore();

    drawFx(now);
    if (!capturing) drawCursor(t);
    post();

    if (capturing){
      capturing = false;
      const url = cvs.toDataURL('image/png');
      const a = document.createElement('a');
      a.download = 'orbis-' + THEMES[themeIdx].id + '.png';
      a.href = url;
      a.click();
    }

    requestAnimationFrame(frame);
  }

  /* ================= 交互 ================= */
  function burst(x, y){
    ripples.push({ x: x, y: y, t0: performance.now(), dur: 1600 });
    for (let i = 0; i < 30; i++){
      const a = Math.random() * TAU;
      const sp = R * (0.35 + Math.random() * 1.5);
      sparks.push({
        x: x, y: y, px: x, py: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        t0: performance.now(),
        dur: 650 + Math.random() * 750,
        r: 0.7 + Math.random() * 2.0
      });
    }
    bump = 1;
  }

  function angleOf(x, y){ return Math.atan2(y - cy, x - cx); }

  cvs.addEventListener('pointerdown', function(e){
    cvs.setPointerCapture(e.pointerId);
    dragging = true;
    dragMoved = 0;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    lastAng = angleOf(e.clientX, e.clientY);
    vel = 0;
    P.x = e.clientX; P.y = e.clientY; P.inside = true;
    idleAt = performance.now();
  });

  cvs.addEventListener('pointermove', function(e){
    P.x = e.clientX;
    P.y = e.clientY;
    P.inside = true;
    idleAt = performance.now();

    if (dragging){
      const d = Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY);
      if (d > dragMoved) dragMoved = d;
      const a = angleOf(e.clientX, e.clientY);
      let da = a - lastAng;
      if (da > Math.PI) da -= TAU;
      if (da < -Math.PI) da += TAU;
      rot += da;
      vel = da * 0.55;
      lastAng = a;
      if (dragMoved > 6) document.getElementById('hint').classList.add('dim');
    }
  });

  function endPointer(e){
    if (!dragging) return;
    dragging = false;
    if (dragMoved < 6){
      burst(e.clientX, e.clientY);
      vel = 0;
    }
  }
  cvs.addEventListener('pointerup', endPointer);
  cvs.addEventListener('pointercancel', function(){ dragging = false; });
  cvs.addEventListener('pointerleave', function(){
    P.inside = false; idleAt = 0; dragging = false;
  });

  cvs.addEventListener('wheel', function(e){
    e.preventDefault();
    zoomTarget = Math.max(0.55, Math.min(1.9, zoomTarget * (1 - e.deltaY * 0.0012)));
  }, { passive: false });

  window.addEventListener('resize', resize);

  Array.prototype.forEach.call(document.querySelectorAll('.th'), function(b){
    b.addEventListener('click', function(){ applyTheme(+b.dataset.i, false); });
  });

  document.getElementById('save').addEventListener('click', function(){ capturing = true; });

  document.addEventListener('keydown', function(e){
    const k = e.key.toLowerCase();
    if (k === 'c') applyTheme((themeIdx + 1) % THEMES.length, false);
    if (k === 'r'){ rot = 0; vel = 0; zoomTarget = 1; }
    if (e.code === 'Space'){ e.preventDefault(); burst(cx, cy); }
  });

  /* ================= 启动 ================= */
  var hashTheme = parseInt((location.hash || '').slice(1), 10);
  applyTheme(THEMES[hashTheme] ? hashTheme : 0, true);
  resize();
  requestAnimationFrame(function(t0){ last = t0; frame(t0); });
})();
</script>

<script>
(function(){
  Element.prototype.setPointerCapture = function(){};
  Element.prototype.releasePointerCapture = function(){};
  window.addEventListener('load', function(){
    var c = document.getElementById('art');
    var btns = document.querySelectorAll('.th');
    btns[1].click();
    var W = window.innerWidth, H = window.innerHeight;
    var x = W*0.5 + 150, y = H*0.5 - 90;
    function mk(t,px,py){ c.dispatchEvent(new PointerEvent(t,{clientX:px,clientY:py,bubbles:true,cancelable:true,pointerId:1,pointerType:'mouse',isPrimary:true})); }
    setTimeout(function(){
      mk('pointermove', x, y);
      
    }, 120);
  });
})();
</script>
</body>
